# Injected by GitHubConfigProperties
github.login=${GITHUB_LOGIN:dummy}
github.oauth=${GITHUB_OAUTH:unset-token}
github.write-oauth=${GITHUB_WRITE_OAUTH:unset-token}

# https://source.redhat.com/departments/strategy_and_operations/it/identityaccessmanagement/it_iam_ipa/specification_idm_infrastructure#jive_content_id_Prod
redhat.ldap.dn=cn=users,cn=accounts,dc=ipa,dc=redhat,dc=com
redhat.ldap.connection=admin1.idm-001.prod.iad2.dc.redhat.com
redhat.ldap.port=389
redhat.ldap.warmup-user=gahealy
redhat.ldap.kerberos.realm=IPA.REDHAT.COM
redhat.ldap.kerberos.kdc=${redhat.ldap.connection}

quarkus.log.category."org.apache.directory.api.ldap.codec".level=WARN
quarkus.log.category."org.apache.directory.api.ldap.extras".level=WARN

# LoginContext ServiceLoader plus GSSAPI Kerberos (native image)
quarkus.native.auto-service-loader-registration=true
quarkus.native.additional-build-args=-H:AdditionalSecurityProviders=sun.security.jgss.SunProvider,-H:IncludeResourceBundles=sun.security.util.resources.security

quarkus.rest-client.alpn=true
quarkus.rest-client.follow-redirects=true
quarkus.rest-client."com.garethahealy.githuborgmanagement.clients.rest.QuayUsersRestClient".url=https://quay.io
quarkus.rest-client."com.garethahealy.githuborgmanagement.clients.rest.QuayUsersRestClient".connect-timeout=5000
quarkus.rest-client."com.garethahealy.githuborgmanagement.clients.rest.QuayUsersRestClient".read-timeout=10000

quarkus.rest-client."com.garethahealy.githuborgmanagement.clients.rest.GitHubDiffRestClient".url=https://github.com
quarkus.rest-client."com.garethahealy.githuborgmanagement.clients.rest.GitHubDiffRestClient".connect-timeout=5000
quarkus.rest-client."com.garethahealy.githuborgmanagement.clients.rest.GitHubDiffRestClient".read-timeout=10000
